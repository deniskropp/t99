<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooted Growth</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000510;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            color: white;
            cursor: default;
        }
        canvas {
            display: block;
        }
        .overlay-content {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            padding: 20px;
            max-width: 500px;
            text-shadow: 0 0 10px rgba(0,0,0,0.7);
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 2px;
        }
        p {
            font-size: 1em;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin: 0;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 5, 16, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 5, 16, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            z-index: 50;
            min-width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: hsla(180, 100%, 70%, 1);
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="start-overlay">Click to begin</div>
    
    <div id="controls">
        <div class="control-group">
            <label for="max-particles">Max Particles <span id="val-max-particles">300</span></label>
            <input type="range" id="max-particles" min="50" max="1000" value="300" step="10">
        </div>
        <div class="control-group">
            <label for="spawn-rate">Spawn Rate <span id="val-spawn-rate">0.35</span></label>
            <input type="range" id="spawn-rate" min="0" max="1" value="0.35" step="0.01">
        </div>
        <div class="control-group">
            <label for="velocity-scale">Velocity <span id="val-velocity-scale">1.0</span></label>
            <input type="range" id="velocity-scale" min="0.1" max="3.0" value="1.0" step="0.1">
        </div>
    </div>

    <canvas id="canvas"></canvas>
    <div class="overlay-content">
        <h1>Rooted Growth</h1>
        <p>A dynamic, evolving visual system that balances emergent complexity with stability.</p>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
